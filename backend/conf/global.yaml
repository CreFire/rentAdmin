port: 8080
sqlite_path: ./bin/rentadmin.db
# Browser origins allowed to call the API cross-origin. The web console uses the Vite proxy and needs none.
cors_allowed_origins: []
log:
  level: info
admin:
  # Do not commit a real value. Set ADMIN_TOKEN instead; empty = random token printed at startup.
  token: ""
auth:
  # Do not commit a real value. Set AUTH_TOKEN_SECRET instead; required when mock_mode is false.
  token_secret: ""
  token_ttl_seconds: 259200
wechat:
  app_id: ""
  app_secret: ""
  mch_id: ""
  mch_serial_no: ""
  api_v3_key: ""
  private_key_path: ""
  notify_url: ""
  default_template_id: ""
  mock_mode: true
reminder:
  enabled: true
  interval_seconds: 600
  retry_delay_seconds: 300
